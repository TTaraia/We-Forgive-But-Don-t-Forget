name: Build the war-years videos (English, Amharic, Tigrinya)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install edge-tts pillow shapely numpy
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: English
        run: python make_history.py en
      - name: Amharic (skipped if scenes_am.txt is missing)
        run: python make_history.py am
      - name: Tigrinya (skipped if scenes_ti.txt is missing)
        run: python make_history.py ti
      - uses: actions/upload-artifact@v5
        with:
          name: remembering-videos
          path: |
            remembering_*.mp4
            remembering_*.srt
            remembering_*.description.txt
            remembering_*_thumbnail.png
