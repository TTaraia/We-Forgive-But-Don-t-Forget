name: Build recount of various atrocities committed by Ethiopian military forces on Eritrean Citizens videos
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install edge-tts pillow shapely numpy
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python make_history.py en
      - run: python make_history.py am
      - run: python make_history.py ti
      - uses: actions/upload-artifact@v5
        with:
          name: ethiopian-atrocities-on-eritreans
          path: |
            remembering_*.mp4
            remembering_*.srt
            remembering_*.description.txt
            remembering_*_thumbnail.png
